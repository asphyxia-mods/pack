# Which mod each non-mod file in this pack belongs to, keyed by mods/<name>.pw.toml.
# A list means the file stays while any of those mods is present.
# "minecraft" and "pack" own files that don't belong to any mod.
# Checked by scripts/check-files.py; `--prune` deletes files whose mods are gone.

"options.txt" = "minecraft"
"icon.png" = "pack"

